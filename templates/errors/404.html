{% extends "base.html" %}

{% block title %}Page Not Found (404) — E-Doot{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; text-align: center; margin-top: 4rem; margin-bottom: 4rem;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;">Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    The requested page or route could not be found. If you are experiencing an emergency, dial 108 or 112 immediately.
  </p>
  <div style="display: flex; gap: 10px; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
    <a href="tel:108" class="btn btn-danger">Call Ambulance (108)</a>
  </div>
</div>
{% endblock %}
